settings:

  lava-rising:
    rise-interval-ticks: 40
    blocks-per-rise: 1
    start-y-offset: -5
  flood:
    rise-interval-ticks: 40
    blocks-per-rise: 1
  tnt-rain:
    interval-ticks: 20
    tnt-per-wave: 3
    fuse-ticks: 40
  meteor-shower:
    interval-ticks: 30
    meteors-per-wave: 2
    explosion-power: 2.5
  lightning-storm:
    interval-ticks: 25
    strikes-per-wave: 2
  strong-wind:
    strength: 1.2
    interval-ticks: 10
  knockback-madness:
    multiplier: 3.0
  double-damage:
    multiplier: 2.0
  acid-rain:
    interval-ticks: 20
    damage: 1.0
  poison-cloud:
    radius: 4.0
    amplifier: 0
  earthquake:
    interval-ticks: 8
    strength: 0.45
  tornado:
    pull-strength: 0.35
  firestorm:
    interval-ticks: 15
    fires-per-wave: 8
  solar-flare:
    damage: 1.5
  volcano:
    interval-ticks: 15
    power: 1.2
  lava-geysers:
    interval-ticks: 30
    height: 5
  exploding-chickens:
    per-player: 6
    explode-interval-ticks: 60
    power: 1.5
  falling-anvils:
    interval-ticks: 25
    amount: 3
  random-fireballs:
    interval-ticks: 25
    power: 1.8
  zombie-apocalypse:
    mobs-per-player: 10
  skeleton-army:
    mobs-per-player: 8
  creeper-madness:
    mobs-per-player: 4
  mob-invasion:
    mobs-per-player: 6
  water-tornado:
    pull-strength: 0.4
    damage: 0.5
