# Scoreboard / tablist / hologram / message animations (TAB-style)
# Use in any text with:
#   %blazechaosanimation_title%
#   %blazechaos_animation_title%
#   %animation:title%
#   {animation:title}
#
# interval = ticks between frame changes (animation engine advances every server tick)
config-version: 2

title:
  interval: 2
  frames:
    - "&aBlaze's Chaos"
    - "&2Blaze's Chaos"
    - "&fBlaze's Chaos"

server:
  interval: 5
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

coins:
  interval: 10
  frames:
    - "&6Coins"
    - "&eCoins"
    - "&fCoins"

discord:
  interval: 8
  frames:
    - "&9discord.gg/example"
    - "&bdiscord.gg/example"
    - "&fdiscord.gg/example"

online:
  interval: 15
  frames:
    - "&aOnline"
    - "&2Online"
    - "&fOnline"

footer:
  interval: 6
  frames:
    - "&7Survive the chaos"
    - "&8Survive the chaos"
    - "&fSurvive the chaos"
