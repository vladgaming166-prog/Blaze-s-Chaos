# Scoreboard / tablist / hologram / message animations (TAB-style)
#
# Each placeholder maps to EXACTLY one animation by name:
#   %blazechaosanimation_title%  → only "title"
#   %blazechaosanimation_server% → only "server"
#
# RGB / gradient generators are OPT-IN only:
#   rgb: true
#   type: gradient
# Do not enable those unless you want Birdflop-style effects.
#
# interval = server ticks between frame advances
config-version: 4

title:
  interval: 2
  frames:
    - "&aBlaze's Chaos"
    - "&2Blaze's Chaos"
    - "&fBlaze's Chaos"

server:
  interval: 5
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

coins:
  interval: 10
  frames:
    - "&6Coins"
    - "&eCoins"
    - "&fCoins"

discord:
  interval: 8
  frames:
    - "&9discord.gg/example"
    - "&bdiscord.gg/example"
    - "&fdiscord.gg/example"

online:
  interval: 15
  frames:
    - "&aOnline"
    - "&2Online"
    - "&fOnline"

footer:
  interval: 6
  frames:
    - "&7Survive the chaos"
    - "&8Survive the chaos"
    - "&fSurvive the chaos"

play:
  interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
