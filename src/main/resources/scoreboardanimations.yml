# Scoreboard / tablist / hologram / message animations (TAB-style)
#
# Each placeholder maps to EXACTLY one animation by name:
#   %blazechaosanimation_title%  → only "title"
#   %blazechaosanimation_server% → only "server"
#   %blazechaosanimation_coins%  → only "coins"
# Also: %blazechaos_animation_<name>%  |  %animation:<name>%  |  {animation:<name>}
#
# interval = server ticks between frame advances (engine ticks every 1 tick)
#
# Types:
#   frames (default) — cycle frames list
#   rgb: true        — Birdflop-style per-character RGB wave (moves over time)
#   type: gradient   — shifting MiniMessage gradient
config-version: 3

title:
  interval: 1
  rgb: true
  text: "Blaze's Chaos"

server:
  interval: 5
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

coins:
  interval: 10
  frames:
    - "&6Coins"
    - "&eCoins"
    - "&fCoins"

discord:
  interval: 8
  frames:
    - "&9discord.gg/example"
    - "&bdiscord.gg/example"
    - "&fdiscord.gg/example"

online:
  interval: 15
  frames:
    - "&aOnline"
    - "&2Online"
    - "&fOnline"

footer:
  interval: 1
  type: gradient
  text: "Survive the chaos"
  colors:
    - "#FF4500"
    - "#FFD700"
    - "#FF6347"
    - "#FFA500"
    - "#FF4500"

play:
  interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
