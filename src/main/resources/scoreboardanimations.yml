# Scoreboard / tablist animations (TAB-style)
# Use: %blazechaosanimation_name%  |  %animation:name%  |  %blazechaos_animation_name%
#
# Default frames use clean legacy colors (&a &2 &6 &7 &e &f).
# RGB / gradient generators are OPT-IN only (rgb: true / type: gradient).
config-version: 5

title:
  interval: 10
  frames:
    - "&6&lBLAZE'S CHAOS"
    - "&e&lBLAZE'S CHAOS"
    - "&a&lBLAZE'S CHAOS"

server:
  interval: 5
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

coins:
  interval: 10
  frames:
    - "&6Coins"
    - "&eCoins"
    - "&fCoins"

discord:
  interval: 8
  frames:
    - "&9discord.gg/example"
    - "&bdiscord.gg/example"
    - "&fdiscord.gg/example"

online:
  interval: 15
  frames:
    - "&aOnline"
    - "&2Online"
    - "&fOnline"

footer:
  interval: 6
  frames:
    - "&7Survive the chaos"
    - "&8Survive the chaos"
    - "&fSurvive the chaos"

play:
  interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
