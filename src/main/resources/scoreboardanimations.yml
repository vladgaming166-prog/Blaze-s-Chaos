# Scoreboard / tablist animations (TAB-style)
# Reference in any line with: %animation:name%  or  {animation:name}
#
# change-interval is in SCOREBOARD UPDATE TICKS (same as scoreboard update-interval steps).
# Example: update-interval 20 (1 second) + change-interval 2 = frame every 2 seconds.
config-version: 1

title:
  change-interval: 2
  texts:
    - "<gradient:#FF4500:#FFD700><bold>BLAZE'S CHAOS</bold></gradient>"
    - "<gradient:#FFD700:#FF4500><bold>BLAZE'S CHAOS</bold></gradient>"
    - "<gradient:#FF6347:#FFA500><bold>BLAZE'S CHAOS</bold></gradient>"
    - "&6&lBLAZE'S CHAOS"
    - "&e&lBLAZE'S CHAOS"

server:
  change-interval: 5
  texts:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

coins:
  change-interval: 10
  texts:
    - "&6Coins"
    - "&eCoins"
    - "&fCoins"

discord:
  change-interval: 8
  texts:
    - "&9discord.gg/example"
    - "&bdiscord.gg/example"
    - "&fdiscord.gg/example"

online:
  change-interval: 15
  texts:
    - "&aOnline"
    - "&2Online"
    - "&fOnline"

footer:
  change-interval: 6
  texts:
    - "&7Survive the chaos"
    - "&8Survive the chaos"
    - "&fSurvive the chaos"
