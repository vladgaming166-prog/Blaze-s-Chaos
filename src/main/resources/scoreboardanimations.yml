# Animations — TAB-style (Update 3–4 brand palette)
#
# Moving gradients travel across letters (not simple green/white/dark swaps).
# Use: %blazechaosanimation_<name>%
#
# Brand colors: #FF4500 → #FFD700 (classic Blaze's Chaos)
# RGB/rainbow only when type: rgb is set explicitly.
config-version: 6

title:
  change-interval: 1
  type: moving-gradient
  text: "BLAZE'S CHAOS"
  bold: true
  speed: 0.16
  spread: 0.38
  colors:
    - "#FF4500"
    - "#FF6347"
    - "#FFA500"
    - "#FFD700"
    - "#FFA500"
    - "#FF6347"
    - "#FF4500"

prefix:
  change-interval: 1
  type: moving-gradient
  text: "Blaze's Chaos"
  bold: true
  speed: 0.16
  spread: 0.40
  colors:
    - "#FF4500"
    - "#FF6347"
    - "#FFA500"
    - "#FFD700"
    - "#FFA500"
    - "#FF6347"
    - "#FF4500"

tab_footer:
  change-interval: 1
  type: moving-gradient
  text: "Survive the chaos"
  bold: false
  speed: 0.12
  spread: 0.35
  colors:
    - "#FF4500"
    - "#FFD700"
    - "#FFA500"
    - "#FF4500"

# Optional simple frame cycles (clean, not rainbow)
server:
  change-interval: 5
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

play:
  change-interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
