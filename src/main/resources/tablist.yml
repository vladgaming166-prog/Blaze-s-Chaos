# Tablist — classic clean premium style
config-version: 3

enabled: true
update-interval: 40

animations:
  enabled: true
  frame-interval: 20
  header-frames:
    - "&6&lBlaze's Chaos"
    - "&e&lBlaze's Chaos"
  footer-frames:
    - "&7Survive the chaos"
    - "&eLast player standing"

server-lobby:
  header:
    - "&6&lBlaze's Chaos"
    - "&7play.example.ro"
  footer:
    - ""
    - "&fOnline: &a%server_online%"
    - "&fWins: &a%blazechaos_wins%"
    - "&7discord.gg/example"

waiting:
  header:
    - "&6&lWaiting"
    - "&b%blazechaos_map%"
  footer:
    - "&7Players: &e%blazechaos_players%"

starting:
  header:
    - "&6&lStarting..."
  footer:
    - "&e%blazechaos_players% players"

playing:
  header:
    - "&6&lIN GAME"
    - "&e%blazechaos_event%"
  footer:
    - "&cAlive: %blazechaos_alive% &7| &bNext: %blazechaos_next_event%s"

spectator:
  header:
    - "&7&lSpectating"
  footer:
    - "&8You were eliminated"

ending:
  header:
    - "&6&lGame Over"
  footer:
    - "&eThanks for playing!"
