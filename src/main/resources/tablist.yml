# Tablist — Update 3–4 premium style
# Header/footer branding uses moving RGB gradients
config-version: 4

enabled: true
update-interval: 2

animations:
  enabled: true
  frame-interval: 1
  header-frames:
    - "%blazechaosanimation_title%"
  footer-frames:
    - "%blazechaosanimation_tab_footer%"

server-lobby:
  header:
    - "%blazechaosanimation_title%"
    - "<gray>play.example.ro</gray>"
  footer:
    - ""
    - "%blazechaosanimation_tab_footer%"
    - "<white>Online:</white> <aqua>%server_online%</aqua>"
    - "<white>Wins:</white> <green>%blazechaos_wins%</green>"
    - "<gray>discord.gg/example</gray>"

waiting:
  header:
    - "%blazechaosanimation_title%"
    - "<aqua>%blazechaos_map%</aqua>"
  footer:
    - "<gray>Players:</gray> <yellow>%blazechaos_players%</yellow>"

starting:
  header:
    - "<gold><bold>Starting...</bold></gold>"
  footer:
    - "<yellow>%blazechaos_players% players</yellow>"

playing:
  header:
    - "%blazechaosanimation_title%"
    - "<yellow>%blazechaos_event%</yellow>"
  footer:
    - "<red>Alive: %blazechaos_alive%</red> <gray>|</gray> <aqua>Next: %blazechaos_next_event%s</aqua>"

spectator:
  header:
    - "<gray><bold>Spectating</bold></gray>"
  footer:
    - "<dark_gray>You were eliminated</dark_gray>"

ending:
  header:
    - "<gold><bold>Game Over</bold></gold>"
  footer:
    - "<yellow>Thanks for playing!</yellow>"
