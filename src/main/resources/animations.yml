# Global animated placeholders (TAB-style)
# Use as:
#   %blazechaosanimation_<name>%
#   %blazechaos_animation_<name>%
#   %animation:<name>%
# Works in scoreboards, tablist, bossbars, actionbars, titles, NPC holograms, messages.
# interval = server ticks between frame changes
config-version: 2

title:
  interval: 2
  frames:
    - "&aBlaze's Chaos"
    - "&2Blaze's Chaos"
    - "&fBlaze's Chaos"

server:
  interval: 3
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

ip:
  interval: 4
  frames:
    - "&bplay.example.ro"
    - "&3play.example.ro"
    - "&fplay.example.ro"

queue:
  interval: 5
  frames:
    - "&aQueue Open"
    - "&2Queue Open"
    - "&fQueue Open"

play:
  interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
