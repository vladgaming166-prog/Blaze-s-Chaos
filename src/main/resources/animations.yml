  interval: 3
  frames:
    - "&aplay.example.ro"
    - "&fplay.example.ro"
    - "&eplay.example.ro"

ip:
  interval: 4
  frames:
    - "&bplay.example.ro"
    - "&3play.example.ro"
    - "&fplay.example.ro"

queue:
  interval: 5
  frames:
    - "&aQueue Open"
    - "&2Queue Open"
    - "&fQueue Open"

play:
  interval: 4
  frames:
    - "&eClick to Play"
    - "&6Click to Play"
    - "&fClick to Play"
