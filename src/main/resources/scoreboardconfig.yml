# Scoreboard configuration — classic Blaze's Chaos premium layout
# Supports MiniMessage named colors, & legacy codes, PlaceholderAPI
# Animations (optional): %blazechaosanimation_name% from scoreboardanimations.yml
config-version: 5

enabled: true
update-interval: 20

animations:
  enabled: true
  title-frames:
    - "%blazechaosanimation_title%"
  frame-interval: 1

hide-scores: true

# Server lobby (not in a game)
server-lobby:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "&7play.example.ro"
    - ""
    - "&fOnline: &a%server_online%"
    - "&fCoins: &6%blazechaos_coins%"
    - "&fWins: &a%blazechaos_wins%"
    - "&fKills: &c%blazechaos_kills%"
    - ""
    - "&7Discord:"
    - "&bdiscord.gg/example"
    - ""

waiting:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "&7Map: &b%blazechaos_map%"
    - "&7Players: &e%blazechaos_players%"
    - "&7State: &a%blazechaos_state%"
    - ""
    - "&6Waiting for players..."
    - ""

starting:
  title: "&6&lSTARTING"
  lines:
    - ""
    - "&7Map: &b%blazechaos_map%"
    - "&7Players: &e%blazechaos_players%"
    - "&7Starts in: &6%blazechaos_time%s"
    - ""

playing:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "&7Alive: &c%blazechaos_alive%"
    - "&7Event: &e%blazechaos_event%"
    - "&7Next: &b%blazechaos_next_event%s"
    - "&7Time: &f%blazechaos_time%s"
    - "&7Map: &b%blazechaos_map%"
    - ""

spectator:
  title: "&7&lSPECTATING"
  lines:
    - ""
    - "&7Alive: &c%blazechaos_alive%"
    - "&7Event: &e%blazechaos_event%"
    - "&7Map: &b%blazechaos_map%"
    - ""
    - "&8You died!"
    - ""

ending:
  title: "&6&lGAME OVER"
  lines:
    - ""
    - "&7Map: &b%blazechaos_map%"
    - "&7Winner soon..."
    - ""
