# Scoreboard configuration
# Supports: MiniMessage, & legacy codes, hex (#RRGGBB / &#RRGGBB), PlaceholderAPI
# Animations: %blazechaosanimation_name% (also %animation:name% / %blazechaos_animation_name%)
config-version: 3

enabled: true
# Fast enough for smooth animation placeholders without flicker (content-cached writes)
update-interval: 2

animations:
  enabled: true
  title-frames:
    - "%blazechaosanimation_title%"
  frame-interval: 1

# Hide vanilla sidebar score numbers (15..1)
hide-scores: true

# Shown when the player is on the SERVER (not in a game / waiting room)
server-lobby:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "%blazechaosanimation_server%"
    - ""
    - "<white>%blazechaosanimation_online%:</white> <aqua>%server_online%</aqua>"
    - "<white>%blazechaosanimation_coins%:</white> <gold>%blazechaos_coins%</gold>"
    - "<white>Wins:</white> <green>%blazechaos_wins%</green>"
    - "<white>Kills:</white> <red>%blazechaos_kills%</red>"
    - ""
    - "<gray>Discord:</gray>"
    - "%blazechaosanimation_discord%"
    - ""
    - "%blazechaosanimation_footer%"

# Waiting room (joined arena, not started)
waiting:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "<gray>Map: <aqua>%blazechaos_map%</aqua>"
    - "<gray>Players: <yellow>%blazechaos_players%</yellow>"
    - "<gray>State: <green>%blazechaos_state%</green>"
    - ""
    - "<gold>Waiting for players...</gold>"
    - ""

starting:
  title: "<gradient:#FF4500:#FFD700><bold>STARTING</bold></gradient>"
  lines:
    - ""
    - "<gray>Map: <aqua>%blazechaos_map%</aqua>"
    - "<gray>Players: <yellow>%blazechaos_players%</yellow>"
    - "<gray>Starts in: <gold>%blazechaos_time%s</gold>"
    - ""

playing:
  title: "%blazechaosanimation_title%"
  lines:
    - ""
    - "<gray>Alive: <red>%blazechaos_alive%</red>"
    - "<gray>Event: <yellow>%blazechaos_event%</yellow>"
    - "<gray>Next: <aqua>%blazechaos_next_event%s</aqua>"
    - "<gray>Time: <white>%blazechaos_time%s</white>"
    - "<gray>Map: <aqua>%blazechaos_map%</aqua>"
    - ""

spectator:
  title: "<gradient:#888888:#CCCCCC><bold>SPECTATING</bold></gradient>"
  lines:
    - ""
    - "<gray>Alive: <red>%blazechaos_alive%</red>"
    - "<gray>Event: <yellow>%blazechaos_event%</yellow>"
    - "<gray>Map: <aqua>%blazechaos_map%</aqua>"
    - ""
    - "<dark_gray>You died!</dark_gray>"
    - ""

ending:
  title: "<gradient:#FFD700:#FF4500><bold>GAME OVER</bold></gradient>"
  lines:
    - ""
    - "<gray>Map: <aqua>%blazechaos_map%</aqua>"
    - "<gray>Winner soon...</gray>"
    - ""
